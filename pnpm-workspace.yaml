packages:
  - apps/*
  - infra/cdk
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true

injectWorkspacePackages: true

overrides:
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.23.1'

forceLegacyDeploy: true
