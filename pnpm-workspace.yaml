packages:
  - apps/*
  - infra/cdk
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  puppeteer: true
  unrs-resolver: true
  vue-demi: true

injectWorkspacePackages: true

overrides:
  deepmerge-ts: '>=8.0.0'
  follow-redirects: ^1.16.1
  dompurify: 3.4.17
  ip-address@<=10.7.3: ^10.7.4
  katex@>=0.11.0 <0.18.2: ^0.18.2
  lodash-es: 4.18.1
  mysql2: '>=3.23.1'
  postcss-selector-parser@<7.1.6: ^7.1.6
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  sharp@<0.35.5: ^0.35.5
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  'chromium-bidi>zod': 4.6.6

forceLegacyDeploy: true

minimumReleaseAgeExclude:
  - ip-address@10.7.1
  - katex@0.18.2
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
  - postcss-selector-parser@7.1.6
  - sharp@0.35.5
  - driver.js@1.10.2
