packages:
  - apps/*
  - infra/cdk
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  puppeteer: set this to true or false
  unrs-resolver: true
  vue-demi: true

injectWorkspacePackages: true

overrides:
  deepmerge-ts: '>=8.0.0'
  ip-address@<=10.7.0: ^10.7.1
  mysql2: '>=3.23.1'

forceLegacyDeploy: true

minimumReleaseAgeExclude:
  - ip-address@10.7.1
