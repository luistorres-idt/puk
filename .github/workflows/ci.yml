name: CI & Quality Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validation & client generation
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/puk?schema=public
        run: |
          pnpm prisma:validate
          pnpm prisma:generate

      - name: Lint workspace
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      - name: Validate OpenAPI documentation
        run: pnpm docs:validate

      - name: Build applications
        run: pnpm build

      - name: Synthesize AWS infrastructure
        run: pnpm infra:synth

      - name: Test AWS infrastructure
        run: pnpm infra:test

      - name: Security audit
        run: pnpm audit

      - name: Install Playwright browsers
        run: pnpm --filter @puk/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
