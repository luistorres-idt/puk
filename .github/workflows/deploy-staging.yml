name: Deploy Staging

on:
  workflow_run:
    workflows: ['CI & Quality Pipeline']
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && vars.AWS_STAGING_READY == 'true'
    name: Deploy AWS staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      GITHUB_DEPLOY_ROLE_NAME: ${{ vars.GITHUB_DEPLOY_ROLE_NAME }}
      STAGING_RUNTIME_SECRET_ID: ${{ vars.STAGING_RUNTIME_SECRET_ID }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate AWS deployment variables
        run: |
          for variable in AWS_ACCOUNT_ID AWS_REGION GITHUB_DEPLOY_ROLE_NAME STAGING_RUNTIME_SECRET_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable repository variable must be configured"
              exit 1
            fi
          done
          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must be a 12-digit account ID"
            exit 1
          fi

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GITHUB_DEPLOY_ROLE_NAME }}

      - name: Deploy CDK stacks
        run: pnpm infra:deploy

      - name: Read staging public IPv4
        id: staging
        run: |
          asg_name=$(aws cloudformation describe-stacks \
            --stack-name PukStagingApplication \
            --query "Stacks[0].Outputs[?OutputKey=='EcsHostAutoScalingGroupName'].OutputValue" \
            --output text)
          instance_id=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$asg_name" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId | [0]" \
            --output text)
          public_ip=$(aws ec2 describe-instances --instance-ids "$instance_id" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          if [[ -z "$public_ip" || "$public_ip" == "None" ]]; then
            echo "Could not determine the staging EC2 public IPv4" >&2
            exit 1
          fi
          echo "url=http://${public_ip}" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        env:
          TARGET_URL: ${{ steps.staging.outputs.url }}
        run: ./infra/scripts/smoke-test.sh
